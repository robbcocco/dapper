<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Master for every app icon size: render to a 1024 px PNG, then run "tauri icon" on it (see CLAUDE.md). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36363a"/>
      <stop offset="1" stop-color="#18181a"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#d4d4da"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="button" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5cb0ff"/>
      <stop offset="0.55" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0060d6"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="wheelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Body: macOS icon grid (824 px squircle on a 1024 canvas). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#iconShadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Click wheel. -->
  <circle cx="512" cy="512" r="314" fill="url(#wheel)" filter="url(#wheelShadow)"/>
  <circle cx="512" cy="512" r="312" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Controls, centred between the button and the rim. -->
  <g fill="#8e8e96" stroke="#8e8e96" stroke-width="5" stroke-linejoin="round">
    <!-- menu -->
    <g transform="translate(512 296)">
      <rect x="-32" y="-24" width="64" height="10" rx="5"/>
      <rect x="-32" y="-5" width="64" height="10" rx="5"/>
      <rect x="-32" y="14" width="64" height="10" rx="5"/>
    </g>
    <!-- next -->
    <g transform="translate(728 512)">
      <path d="M-32 -20 L-4 0 L-32 20 Z"/>
      <path d="M-4 -20 L24 0 L-4 20 Z"/>
      <rect x="25" y="-20" width="7" height="40" rx="2"/>
    </g>
    <!-- previous -->
    <g transform="translate(296 512) scale(-1 1)">
      <path d="M-32 -20 L-4 0 L-32 20 Z"/>
      <path d="M-4 -20 L24 0 L-4 20 Z"/>
      <rect x="25" y="-20" width="7" height="40" rx="2"/>
    </g>
    <!-- play / pause -->
    <g transform="translate(512 728)">
      <path d="M-30 -20 L-2 0 L-30 20 Z"/>
      <rect x="8" y="-20" width="8" height="40" rx="2"/>
      <rect x="23" y="-20" width="8" height="40" rx="2"/>
    </g>
  </g>

  <!-- Centre button, sunk into the wheel. -->
  <circle cx="512" cy="512" r="124" fill="none" stroke="url(#groove)" stroke-width="8"/>
  <circle cx="512" cy="512" r="114" fill="url(#button)"/>
  <ellipse cx="512" cy="458" rx="80" ry="44" fill="url(#shine)"/>
</svg>
