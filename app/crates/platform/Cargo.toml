[package]
name = "dapper-platform"
description = "Drive detection, eject, free space, macOS sidecar/xattr cleanup, secure storage."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
dapper-domain.workspace = true
tokio = { workspace = true, features = ["sync", "process"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
xattr.workspace = true
security-framework = { workspace = true, features = ["OSX_10_15"] }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-disk-arbitration.workspace = true
dispatch2.workspace = true

[target.'cfg(windows)'.dependencies]
serde_json.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
