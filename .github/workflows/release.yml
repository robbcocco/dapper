name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dapper-macos
          - os: windows-latest
            artifact: dapper-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Check UI
        run: npm --prefix ui run check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build app bundle
        run: npm --prefix ui exec -- tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/target/release/bundle/dmg/*.dmg
            app/target/release/bundle/msi/*.msi
            app/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        run: |
          SEMVER=$(jq -r .version app/src-tauri/tauri.conf.json)
          TAG="v${SEMVER}-build.${{ github.run_number }}"
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Dapper ${{ steps.meta.outputs.semver }} (build ${{ github.run_number }})
          generate_release_notes: true
          # upload-artifact keeps the bundle subfolders (dmg/, msi/, nsis/).
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
          fail_on_unmatched_files: true
