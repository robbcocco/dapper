name: Build

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Check UI
        run: npm --prefix ui run check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build app bundle
        run: npm --prefix ui exec -- tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: dapper-${{ matrix.os }}
          path: |
            app/target/release/bundle/dmg/*.dmg
            app/target/release/bundle/macos/*.app
            app/target/release/bundle/msi/*.msi
            app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
